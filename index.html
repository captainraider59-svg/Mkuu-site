<!DOCTYPE html>
<html>
<head>
    <title>Website ya Mkuu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            margin: 50px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        h1 {
            color: #00ff88;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px black;
            animation: glow 2s infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 10px #00ff88; }
            to { text-shadow: 0 0 20px #00ff88, 0 0 30px #00ff88; }
        }
        
        img {
            width: 120px;
            border-radius: 50%;
            border: 4px solid #00ff88;
            margin: 20px 0;
        }
        
        button {
            background: #00ff88;
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,255,136,0.4);
        }
        
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(0,255,136,0.6);
        }
        
        .red-text {
            color: #ff4444;
            font-weight: bold;
            font-size: 1.2em;
        }
        
        a {
            color: #00ccff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mambo Mkuu! 🧔🏾</h1>
        
        <img src="https://i.imgur.com/8Q1wz1p.png" alt="Mkuu Developer">
        
        <h2>Huyu ni Mkuu - Developer!</h2>
        
        <p>Hongera! Hii ni website yangu ya kwanza.</p>
        
        <p class="red-text">Nimetengeneza na simu yangu!</p>
        
        <button onclick="alert('MKUU NI BALAA! 🔥')">Nibonyeze</button>
        
        <br><br>
        
        <a href="https://wa.me/255XXXXXXXXX">Nicheki WhatsApp</a>
        
        <p>Level 5 Imeanza ✅</p>
    </div>
</body>
</html>
